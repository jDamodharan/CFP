<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call for Proposals | ExploitX Meetup 0x1 2026</title>

<link rel="stylesheet" href="cfp_style.css">
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>

<header>
    <h1>Call for Proposals</h1>
    <p>ExploitX Cybersecurity & Networking Meetup 0x1 2026</p>
</header>

<main>
<section class="rsvp-section">
    <div class="container">
        <h1 class="title">Submit Your Proposal</h1>
        <form id="cfpForm">

            <h2 class="section-title">Proposal Details</h2>

            <div class="form-group">
                <label>Proposal Title <span>*</span></label>
                <input type="text" class="proposal-title" required>
            </div>

            <div class="form-group">
                <label>Proposal Description <span>*</span></label>
                <div class="quill-editor" id="editor-description"></div>
                <input type="hidden" class="proposal-description">
            </div>

            <div class="form-group">
                <label>Proposal Takeaways <span>*</span></label>
                <div class="quill-editor" id="editor-takeaways"></div>
                <input type="hidden" class="proposal-takeaways">
            </div>

            <div class="form-group">
                <label>Is this your first talk? <span>*</span></label>
                <select class="first-talk" required>
                    <option value="">Select</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <h2 class="section-title">Personal Information</h2>

            <div class="form-group">
                <label>Full Name <span>*</span></label>
                <input type="text" class="fullname" required>
            </div>

             <div class="form-group">
                <label>Gender <span>*</span></label>
                <select class="gender" required>
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label>Occupation<span>*</span></label>
                <input type="text" class="occupation">
            </div>

            <div class="form-group">
                <label>Organization<span>*</span></label>
                <input type="text" class="organization">
            </div>

            <div class="form-group">
                <label>Email <span>*</span></label>
                <input type="email" class="email" required>
            </div>

            <div class="form-group">
                <button type="button" id="sendOtpBtn" class="btn-primary">Send OTP</button>
            </div>

            <div class="form-group" id="otpSection" style="display:none;">
                <label>Enter OTP <span>*</span></label>
                <input type="text" id="otpInput" maxlength="6" placeholder="6-digit OTP">
                <button type="button" id="verifyOtpBtn" class="btn-primary">Verify OTP</button>
            </div>


            <div class="form-group">
                <label>Phone <span>*</span></label>
                <input type="tel" class="phone" required maxlength="10" pattern="[0-9]{10}">
            </div>

            <div class="form-group">
                <label>Location <span>*</span></label>
                <input type="text" class="location" required>
            </div>

            <button type="submit" class="btn-primary">Submit Proposal</button>
        </form>
    </div>
</section>
</main>

<footer class="footer">
    <p id="footerYear"></p>
</footer>

<!-- Quill JS -->
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
/* ---------------- QUILL ---------------- */
const quillDescription = new Quill("#editor-description", {
    theme: "snow",
    placeholder: "Write your proposal description..."
});
const quillTakeaways = new Quill("#editor-takeaways", {
    theme: "snow",
    placeholder: "List the proposal takeaways..."
});

/* ---------------- EMAIL CONFIG ---------------- */
let emailMain = null;
let emailOtp = null;

/* ---------------- OTP STATE ---------------- */
let generatedOTP = null;
let otpExpiresAt = null;
let otpAttempts = 0;
let emailVerified = false;
let resendCooldown = false;
let configLoaded = false;

/* ---------------- LOAD CONFIG ---------------- */
async function loadEmailConfig() {
    try {
        const res = await fetch("/api/config.js", { cache: "no-store" });

        if (!res.ok) {
            throw new Error("API returned status " + res.status);
        }

        const cfg = await res.json();

        if (!cfg.main || !cfg.otp) {
            throw new Error("Invalid config response");
        }

        emailMain = cfg.main;
        emailOtp = cfg.otp;
        configLoaded = true;

    } catch (err) {
    }
}
loadEmailConfig();

/* ---------------- OTP HELPERS ---------------- */
function generateOTP() {
    return Math.floor(100000 + Math.random() * 900000).toString();
}

function isOtpExpired() {
    return !otpExpiresAt || Date.now() > otpExpiresAt;
}

function startResendCooldown() {
    resendCooldown = true;
    document.getElementById("sendOtpBtn").disabled = true;

    setTimeout(() => {
        resendCooldown = false;
        document.getElementById("sendOtpBtn").disabled = false;
    }, 60000); // 60 sec
}

/* ---------------- SEND OTP ---------------- */
document.getElementById("sendOtpBtn").addEventListener("click", async () => {
    if (!configLoaded || !emailOtp) {
        alert("Email service not ready. Please wait and try again.");
        return;
    }


    const email = document.querySelector(".email").value.trim();
    if (!email) {
        alert("Enter email first");
        return;
    }

    generatedOTP = generateOTP();
    otpExpiresAt = Date.now() + (5 * 60 * 1000); // 5 minutes
    otpAttempts = 0;
    emailVerified = false;

    emailjs.init(emailOtp.publicKey);

    try {
        await emailjs.send(
            emailOtp.serviceId,
            emailOtp.templateOtp,
            { email: email, otp: generatedOTP }
        );

        document.getElementById("otpSection").style.display = "block";
        startResendCooldown();
        alert("OTP sent. Valid for 5 minutes.");
    } catch (e) {
        alert("Failed to send OTP");
        console.error(e);
    }
});

/* ---------------- VERIFY OTP ---------------- */
document.getElementById("verifyOtpBtn").addEventListener("click", () => {
    const entered = document.getElementById("otpInput").value.trim();

    if (isOtpExpired()) {
        alert("OTP expired. Please request a new one.");
        generatedOTP = null;
        return;
    }

    otpAttempts++;
    if (otpAttempts > 3) {
        alert("Too many attempts. Request a new OTP.");
        generatedOTP = null;
        return;
    }

    if (entered === generatedOTP) {
        emailVerified = true;
        generatedOTP = null;
        alert("Email verified successfully");
    } else {
        alert("Invalid OTP");
    }
});

/* ---------------- FORM SUBMIT ---------------- */
document.getElementById("cfpForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!emailVerified) {
        alert("Verify your email before submitting");
        return;
    }

    const phone = document.querySelector(".phone").value.trim();
    if (!/^[0-9]{10}$/.test(phone)) {
        alert("Phone number must be exactly 10 digits");
        return;
    }

    document.querySelector(".proposal-description").value =
        quillDescription.root.innerHTML;
    document.querySelector(".proposal-takeaways").value =
        quillTakeaways.root.innerHTML;

    const data = {
        proposal_title: document.querySelector(".proposal-title").value,
        proposal_description: document.querySelector(".proposal-description").value,
        proposal_takeaways: document.querySelector(".proposal-takeaways").value,
        first_talk: document.querySelector(".first-talk").value,
        fullname: document.querySelector(".fullname").value,
        gender: document.querySelector(".gender").value,
        occupation: document.querySelector(".occupation").value,
        organization: document.querySelector(".organization").value,
        email: document.querySelector(".email").value,
        phone,
        location: document.querySelector(".location").value
    };

    emailjs.init(emailMain.publicKey);

    try {
        await emailjs.send(
            emailMain.serviceId,
            emailMain.templateOwner,
            data
        );
        await emailjs.send(
            emailMain.serviceId,
            emailMain.templateAutoReply,
            data
        );

        alert("Your proposal has been submitted successfully!");
        document.getElementById("cfpForm").reset();
        setTimeout(() => window.location.href = "index.html", 2000);
    } catch (err) {
        alert("Submission failed");
        console.error(err);
    }
});

/* ---------------- FOOTER ---------------- */
document.getElementById("footerYear").textContent =
    `© ${new Date().getFullYear()} ExploitX Meetup`;
</script>


</body>
</html>
